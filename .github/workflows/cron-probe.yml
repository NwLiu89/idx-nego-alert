name: Cron probe

# Temporary. The real alert workflow's schedule has never fired once, while dispatch and push
# triggers work fine. This isolates the variable: the simplest possible cron, no inputs, no
# secrets, no conditions. If this fires and nego-alert does not, the fault is in that workflow's
# cron expression. If neither fires, the fault is with schedules on this repo or account.
# Delete once the question is answered.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - run: date -u '+probe fired at %Y-%m-%d %H:%M UTC'
