name: Telegram whoami

# Setup diagnostic, run by hand. Answers "which bot is TELEGRAM_BOT_TOKEN, and what is my
# chat id" using the secrets already stored here, so the token never has to be copied around.
# Delete this workflow once a real alert has been delivered.

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Also send a test message to TELEGRAM_CHAT_ID'
        type: boolean
        default: false

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify bot and chats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-whoami.js ${{ inputs.send_test && '--send-test' || '' }}
