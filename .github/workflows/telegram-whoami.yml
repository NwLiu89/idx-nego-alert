name: Telegram whoami

# Setup diagnostic, run by hand. Answers "which bot is TELEGRAM_BOT_TOKEN, and what is my
# chat id" using the secret already stored here, so the token never has to be copied around.
# Delete this workflow once TELEGRAM_CHAT_ID is confirmed working.

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify bot and chats
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/telegram-whoami.js
